# Flyway del producto Ventas360.
# URL / user / password NO van acá: solo env (FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD).
# El schema no se pone en la URL: search_path lo setea el rol ventas_migrator.

flyway.schemas=ventas
flyway.defaultSchema=ventas
flyway.table=flyway_schema_history
flyway.locations=filesystem:sql
flyway.validateOnMigrate=true
flyway.outOfOrder=false
flyway.connectRetries=10

# Community: no hay undo. No agregar U__*.sql.
