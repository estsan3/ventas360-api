# Stack Ventas360 en Docker (API + web + Postgres).
# Desde este repo:
#   docker compose up --build -d
#
# URLs:
#   Front  http://localhost:4201
#   API    http://localhost:8001/docs
#   DB     localhost:5433
#
# Login demo: admin@ventas360.com / demo12345

services:
  api:
    build: .
    image: ventas360-api:latest
    ports:
      - "8001:8000"
    environment:
      VENTAS360_ENTORNO: dev
      VENTAS360_DATABASE_URL: postgresql+asyncpg://ventas360:ventas360@db:5432/ventas360
      VENTAS360_JWT_SECRETO: secreto-solo-para-desarrollo
      VENTAS360_CORS_ORIGINS: http://localhost:4201,http://127.0.0.1:4201
      VENTAS360_SEED_AL_INICIAR: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../ventas360-web
      dockerfile: Dockerfile
    image: ventas360-web:latest
    ports:
      - "4201:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ventas360
      POSTGRES_PASSWORD: ventas360
      POSTGRES_DB: ventas360
    ports:
      - "5433:5432"
    volumes:
      - ventas360-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventas360 -d ventas360"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Profile opcional: bootstrap de roles + Flyway migrate (DB appdb, schema ventas).
  #   docker compose up -d db
  #   docker compose --profile flyway run --rm flyway-bootstrap
  #   docker compose --profile flyway run --rm flyway
  flyway-bootstrap:
    image: postgres:17-alpine
    profiles: ["flyway"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ventas360
      PGPASSWORD: ventas360
      ADMIN_DB: postgres
      APP_DB: appdb
      VENTAS_MIGRATOR_PASSWORD: ${VENTAS_MIGRATOR_PASSWORD:-ventas_migrator}
      VENTAS_APP_PASSWORD: ${VENTAS_APP_PASSWORD:-ventas_app}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/bootstrap-roles.sh"]
    depends_on:
      db:
        condition: service_healthy

  flyway:
    image: flyway/flyway:11
    profiles: ["flyway"]
    volumes:
      - ./flyway/sql:/flyway/sql
      - ./flyway/conf:/flyway/conf
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/appdb
      FLYWAY_USER: ventas_migrator
      FLYWAY_PASSWORD: ${VENTAS_MIGRATOR_PASSWORD:-ventas_migrator}
    command: ["-connectRetries=60", "migrate"]
    depends_on:
      flyway-bootstrap:
        condition: service_completed_successfully

volumes:
  ventas360-pgdata:
